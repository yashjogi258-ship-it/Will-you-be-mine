<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be Mine? ❤️</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffd6e7,#fff0f5);overflow:hidden}
.card{width:min(90%,420px);padding:42px 25px;text-align:center;background:rgba(255,255,255,.88);
border-radius:28px;box-shadow:0 15px 45px rgba(180,60,100,.2)}
.heart{font-size:70px;animation:beat 1s infinite}.title{font-size:34px;color:#d6336c;margin:10px 0}
p{font-size:19px;color:#555}.buttons{margin-top:28px;display:flex;gap:15px;justify-content:center}
button{border:0;border-radius:30px;padding:14px 28px;font-size:18px;cursor:pointer}
#yes{background:#e83e70;color:white}.no{background:#eee;color:#555}
#message{display:none;font-size:25px;color:#d6336c;font-weight:bold;margin-top:25px}
.float{position:fixed;font-size:25px;animation:fall 5s linear infinite;top:-40px}
@keyframes beat{50%{transform:scale(1.15)}} @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="card">
  <div class="heart">❤️</div>
  <div class="title">Will You Be Mine?</div>
  <p>I have something special to ask you... 💕</p>
  <div class="buttons">
    <button id="yes" onclick="yesClicked()">YES ❤️</button>
    <button class="no" onclick="noClicked()">NO 🙈</button>
  </div>
  <div id="message">Yayyy! ❤️ You just made my day! 🥰</div>
</div>
<script>
function yesClicked(){
 document.getElementById('message').style.display='block';
 for(let i=0;i<30;i++){let h=document.createElement('div');h.className='float';h.textContent='❤️';
 h.style.left=Math.random()*100+'vw';h.style.animationDelay=Math.random()*2+'s';document.body.appendChild(h);}
}
function noClicked(){
 const b=document.querySelector('.no');
 b.textContent='Are you sure? 🥺';
}
</script>
</body>
</html>
